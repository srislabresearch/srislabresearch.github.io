<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper</title>
  <style>
    html, body { height: 100%; margin: 0; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="frame"></iframe>

  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get("file");

    if (!file) {
      document.body.innerHTML =
        "<p style='font-family:Arial;padding:16px'>Missing ?file=...pdf</p>";
    } else {
      // This shows the browser's built-in PDF viewer (with zoom/print/download)
      document.getElementById("frame").src = "./" + encodeURIComponent(file);

      // Keep the tab title simple
      document.title = "Paper";
    }
  </script>
</body>
</html>
