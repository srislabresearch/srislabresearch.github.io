<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Viewer</title>
  <style>
    html, body { height: 100%; margin: 0; }
    header { padding: 10px 14px; font-family: Arial, sans-serif; border-bottom: 1px solid #ddd; }
    #name { font-weight: 600; }
    iframe { width: 100%; height: calc(100% - 48px); border: 0; }
  </style>
</head>
<body>
  <header>
    <span id="name">Loading…</span>
  </header>

  <iframe id="frame"></iframe>

  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get("file");

    const nameEl = document.getElementById("name");
    const frame = document.getElementById("frame");

    if (!file) {
      nameEl.textContent = "Missing ?file=...pdf";
    } else {
      nameEl.textContent = file;
      // Use same-folder relative path
      frame.src = "./" + encodeURIComponent(file);
    }
  </script>
</body>
</html>
