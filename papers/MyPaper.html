<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRIS Lab — Papers</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 16px; }
    h1 { margin: 0 0 10px; }
    .sub { color: #555; margin: 0 0 24px; }
    .paper { display: flex; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin: 10px 0; }
    .name { word-break: break-word; }
    .actions a { margin-left: 10px; text-decoration: none; }
    .muted { color: #777; font-size: 0.95em; }
    input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; margin: 10px 0 18px; }
  </style>
</head>
<body>
  <h1>Papers</h1>
  <p class="sub">Auto-generated from the GitHub repository folder <span class="muted">/papers</span>.</p>

  <input id="q" placeholder="Search papers (type part of filename)..." />

  <div id="status" class="muted">Loading…</div>
  <div id="list"></div>

<script>
  // ✅ EDIT THESE 3 VALUES ONCE
  const OWNER = "srislabresearch";     // GitHub org/user
  const REPO  = "srislabresearch.github.io"; // repo name
  const PATH  = "papers";              // folder containing PDFs

  const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
  const listEl = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const qEl = document.getElementById("q");

  let files = [];

  function render() {
    const q = (qEl.value || "").toLowerCase().trim();
    const filtered = files.filter(f => f.name.toLowerCase().includes(q));

    listEl.innerHTML = "";
    statusEl.textContent = filtered.length
      ? `${filtered.length} paper(s) found.`
      : `No papers match your search.`;

    filtered.forEach(f => {
      // f.name is the filename like "MyPaper2025.pdf"
      // Use relative link so it works on github.io and also through Cloudflare proxy (/papers/...)
      const viewHref = `./${encodeURIComponent(f.name)}`;
      const downloadHref = f.download_url; // direct download link from GitHub API

      const row = document.createElement("div");
      row.className = "paper";
      row.innerHTML = `
        <div class="name">
          <div><strong>${f.name}</strong></div>
          <div class="muted">${Math.round((f.size || 0) / 1024)} KB</div>
        </div>
        <div class="actions">
          <a href="${viewHref}" target="_blank" rel="noopener">View</a>
          <a href="${downloadHref}" target="_blank" rel="noopener">Download</a>
        </div>
      `;
      listEl.appendChild(row);
    });
  }

  qEl.addEventListener("input", render);

  fetch(api, { headers: { "Accept": "application/vnd.github+json" } })
    .then(r => {
      if (!r.ok) throw new Error(`GitHub API error: ${r.status}`);
      return r.json();
    })
    .then(data => {
      files = (data || [])
        .filter(x => x.type === "file" && x.name.toLowerCase().endsWith(".pdf"))
        .sort((a,b) => a.name.localeCompare(b.name));
      statusEl.textContent = `Loaded ${files.length} paper(s).`;
      render();
    })
    .catch(err => {
      statusEl.textContent = "Could not load papers list automatically.";
      listEl.innerHTML = `<p class="muted">${err.message}</p>
      <p class="muted">If your repo is private, the GitHub API will block this. Make it public or use a token-based approach.</p>`;
    });
</script>
</body>
</html>
